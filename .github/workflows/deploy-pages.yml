name: Deploy to GitHub Pages

# Builds and publishes the app to GitHub Pages on every push to main.
#
# The app talks to Deriv entirely from the browser: the REST account/OTP calls are
# CORS-enabled by Deriv, and trading runs over a WebSocket. No server runtime is needed,
# which is why a static host is sufficient.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A project site lives at /<repo>/, so a '/' base would request assets from the
      # domain root and 404. A user/org site (<user>.github.io) is served from the root.
      - name: Resolve base path
        run: |
          if [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: bun run build

      # Pages has no rewrite rules, so an unknown path would 404 instead of booting the
      # SPA. Serving index.html as 404.html lets the app handle deep links.
      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Show what shipped
        run: |
          echo "base: $VITE_BASE_PATH"
          grep -oE 'src="[^"]*"' dist/index.html | head -3

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
